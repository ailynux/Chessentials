<header class="site-header">
    <div class="container header-inner">
        <a href="{{ url_for('home') }}" class="logo">
            <img src="{{ url_for('static', filename='images/favicon.png') }}" alt="" class="logo-icon" width="32" height="32">
            <span class="logo-text">Knight<span>Life</span></span>
        </a>

        <nav class="nav-desktop" aria-label="Main">
            <ul class="nav-pills">
                <li><a href="{{ url_for('home') }}" class="nav-pill{% if request.endpoint == 'home' %} active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('home') }}#play" class="nav-pill nav-pill--cta">Play</a></li>
                <li><a href="{{ url_for('strategy') }}" class="nav-pill{% if request.endpoint == 'strategy' %} active{% endif %}">Strategy</a></li>
                <li><a href="{{ url_for('tactics') }}" class="nav-pill{% if request.endpoint == 'tactics' %} active{% endif %}">Tactics</a></li>
                <li><a href="{{ url_for('endgame') }}" class="nav-pill{% if request.endpoint == 'endgame' %} active{% endif %}">Endgame</a></li>
                <li><a href="{{ url_for('contact') }}" class="nav-pill{% if request.endpoint == 'contact' %} active{% endif %}">About</a></li>
            </ul>
        </nav>

        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-mobile">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
        </button>
    </div>

    <nav class="nav-mobile container" id="nav-mobile" aria-label="Mobile" hidden>
        <ul class="nav-mobile-grid">
            <li><a href="{{ url_for('home') }}" class="nav-pill{% if request.endpoint == 'home' %} active{% endif %}">Home</a></li>
            <li><a href="{{ url_for('home') }}#play" class="nav-pill nav-pill--cta">Play</a></li>
            <li><a href="{{ url_for('strategy') }}" class="nav-pill{% if request.endpoint == 'strategy' %} active{% endif %}">Strategy</a></li>
            <li><a href="{{ url_for('tactics') }}" class="nav-pill{% if request.endpoint == 'tactics' %} active{% endif %}">Tactics</a></li>
            <li><a href="{{ url_for('endgame') }}" class="nav-pill{% if request.endpoint == 'endgame' %} active{% endif %}">Endgame</a></li>
            <li><a href="{{ url_for('contact') }}" class="nav-pill{% if request.endpoint == 'contact' %} active{% endif %}">About</a></li>
        </ul>
    </nav>
</header>
