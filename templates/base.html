<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>{% block title %}KnightLife{% endblock %}</title>
    <meta name="description" content="KnightLife — play chess against Stockfish. A personal chess lab by Ailyn Diaz, built on the spirit of Chessentials.">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='chessentials.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include '_header.html' %}
    <main>{% block content %}{% endblock %}</main>
    {% include '_footer.html' %}
    <script src="{{ url_for('static', filename='nav.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
